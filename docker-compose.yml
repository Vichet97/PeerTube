# PeerTube Development Environment
# Run PostgreSQL and Redis for local development
#
# Usage:
#   1. Start services:    docker compose up -d
#   2. Build PeerTube:    pnpm run build
#   3. Run PeerTube:      pnpm run start
#   Or use dev mode:      pnpm run dev (after services are up)

services:
  postgres:
    image: postgres:17-alpine
    container_name: peertube-postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    environment:
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: peertube
      POSTGRES_DB: peertube_dev
    ports:
      - "9004:5432"
    volumes:
      - peertube_postgres_data:/var/lib/postgresql/data
      - ./support/docker/dev/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peertube -d peertube_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: peertube-redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    ports:
      - "9003:6379"
    volumes:
      - peertube_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  rustfs:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    security_opt:
      - "no-new-privileges:true"
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - "9002:9000" # S3 API port
      - "9001:9001" # Console port
    environment:
      # - RUSTFS_VOLUMES=/data/rustfs{0..3} # Define 4 storage volumes
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=peertube
      - RUSTFS_SECRET_KEY=016997791aA
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBS_LOG_DIRECTORY=  # Empty = stdout, lets Docker logging driver handle retention
      # - RUSTFS_TLS_PATH=/opt/tls
      # - RUSTFS_OBS_ENDPOINT=http://otel-collector:4318
    volumes:
      - ./storage/s3/rustfs:/data
      - peertube_rustfs_log:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set rustfs http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY" &&
        mc mb rustfs/vod --ignore-existing &&
        echo "Bucket vod ready"
    environment:
      RUSTFS_ACCESS_KEY: peertube
      RUSTFS_SECRET_KEY: 016997791aA

volumes:
  peertube_postgres_data:
  peertube_redis_data:
  peertube_rustfs_log:
